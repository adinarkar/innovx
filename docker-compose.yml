services:
  backend:
    build:
      context: ./backend
    container_name: innovx-visualnav-api
    ports:
      - "8000:8000"
    environment:
      BACKEND_PORT: "8000"
      FRONTEND_ORIGIN: "http://localhost:5173"
      MODEL_DEVICE: "auto"
      APP_MODE: "real"
    volumes:
      # Persist uploads, generated renders and the embedding cache across runs.
      - ./backend/uploads:/app/uploads
      - ./backend/processed:/app/processed
      - ./backend/cache:/app/cache
      - ./test_data:/test_data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "http://localhost:8000"
    container_name: innovx-visualnav-ui
    ports:
      - "5173:5173"
    depends_on:
      - backend
